name: Update M3U Playlist

on:
  schedule:
    # Runs every 3 hours (adjust as needed)
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    services:
      bgutil-provider:
        image: brainicism/bgutil-ytdlp-pot-provider
        ports:
          - 4416:4416
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write cookies file
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: echo "$YT_COOKIES" > cookies.txt

      - name: Debug - verbose yt-dlp run on one channel
        run: |
          yt-dlp -v --skip-download --simulate \
            --extractor-args "youtube:player_client=web" \
            --cookies cookies.txt \
            "https://www.youtube.com/@sunnewstamil/live" 2>&1 | tee debug_output.txt || true
          echo "----- Filtered for POT/plugin lines -----"
          grep -i -E "plugin|pot|bgutil|token" debug_output.txt || echo "No matching lines found"

      - name: Generate playlist
        run: python generate_playlist.py

      - name: Remove cookies file
        if: always()
        run: rm -f cookies.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --staged --quiet || git commit -m "Auto-update playlist.m3u"
          git pull --rebase origin main
          git push